    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Gracefully prevent unhandled promise rejections from Vite HMR WebSocket closed in restricted environments
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (msg.indexOf('WebSocket closed without opened') !== -1 || msg.indexOf('failed to connect to websocket') !== -1) {
          event.preventDefault();
          console.warn('[Vite HMR] Development hot reload socket disconnected. App running in stable offline-safe mode.');
        }
      });
    </script>
  </head>
  <body class="bg-[#0B0A14] text-slate-100 antialiased selection:bg-purple-500/30 selection:text-pink-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
